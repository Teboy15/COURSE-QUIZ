<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="quiz-container">
    <h1>📊 Quiz Result</h1>

    <div id="score"></div>
    <div id="review"></div>

    <a href="index.html">
        <button>⬅ Back to Courses</button>
    </a>
</div>

<script>

let scoreBox = document.getElementById("score");
let reviewBox = document.getElementById("review");

let userAnswers =
    JSON.parse(localStorage.getItem("answers")) || {};

let quizData =
    JSON.parse(localStorage.getItem("quizData")) || [];

if (quizData.length === 0) {

    scoreBox.innerHTML =
        "<h3>No quiz data found</h3>";
}

/* =========================
   RESULT SYSTEM
========================= */

else {

    let score = 0;

    let reviewHTML = "";

    quizData.forEach((q, index) => {

        let user =
            userAnswers[`q${index}`];

        /* =========================
           MCQ RESULT
        ========================= */

        if (q.type === "mcq") {

            let correct = q.answer;

            let isCorrect =
                user === correct;

            if (isCorrect) {
                score++;
            }

            reviewHTML += `
                <div class="review">

                    <p>
                        <strong>
                            Q${index + 1}:
                        </strong>

                        ${q.question}
                    </p>

                    <p class="${
                        isCorrect
                            ? "correct"
                            : "wrong"
                    }">

                        Your Answer:
                        ${
                            q.options[user]
                            || "Not answered"
                        }

                    </p>

                    <p>
                        <strong>
                            Correct Answer:
                        </strong>

                        ${q.options[correct]}
                    </p>

                    <p>
                        <strong>
                            Explanation:
                        </strong>

                        ${q.explanation}
                    </p>

                    <hr>

                </div>
            `;
        }

        /* =========================
           WRITTEN RESULT
        ========================= */

        else if (q.type === "written") {

            let writtenCorrect =
                user && user.trim() !== "";

            if (writtenCorrect) {
                score++;
            }

            reviewHTML += `
                <div class="review">

                    <p>
                        <strong>
                            Q${index + 1} (Written):
                        </strong>

                        ${q.question}
                    </p>

                    <p class="${
                        writtenCorrect
                            ? "correct"
                            : "wrong"
                    }">

                        Your Answer:<br>

                        ${user || "No answer"}

                    </p>

                    <p>
                        <strong>
                            Suggested Answer:
                        </strong><br>

                        ${q.answerText}
                    </p>

                    <p>
                        <strong>
                            Explanation:
                        </strong>

                        ${q.explanation}
                    </p>

                    <hr>

                </div>
            `;
        }

    });

    /* =========================
       GRADING
    ========================= */

    let total =
        quizData.length;

    let percentage =
        (score / total) * 100;

    let grade = "";
    let status = "";
    let emoji = "";

    if (percentage >= 90) {

        grade = "A";
        status = "Excellent";
        emoji = "🏆";
    }

    else if (percentage >= 75) {

        grade = "B";
        status = "Very Good";
        emoji = "😄";
    }

    else if (percentage >= 50) {

        grade = "C";
        status = "Good";
        emoji = "👍";
    }

    else if (percentage >= 35) {

        grade = "D";
        status = "Average";
        emoji = "😐";
    }

    else {

        grade = "F";
        status = "Fail";
        emoji = "❌";
    }

    scoreBox.innerHTML = `
        <h2>
            Score: ${score} / ${total}
        </h2>

        <h3>
            ${emoji} ${status}
        </h3>

        <h4>
            Grade: ${grade}
        </h4>

        <p>
            ${percentage.toFixed(1)}%
        </p>
    `;

    reviewBox.innerHTML =
        reviewHTML;

    /* =========================
       CLEAR STORAGE
    ========================= */

    localStorage.removeItem("answers");
    localStorage.removeItem("endTime");
    localStorage.removeItem("currentQuestion");
localStorage.removeItem("selectedChapter");
}

</script>
